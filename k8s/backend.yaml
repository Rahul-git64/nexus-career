apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: private-media
          emptyDir: {}
      initContainers:
        # Runs DB migrations and seeds idempotent demo data before the app starts.
        - name: migrate
          image: nexus-career-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python manage.py migrate --noinput && python manage.py seed_demo
          envFrom:
            - secretRef:
                name: nexus-secrets
            - configMapRef:
                name: nexus-config
          volumeMounts:
            - name: private-media
              mountPath: /app/private_media
      containers:
        - name: backend
          image: nexus-career-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: nexus-secrets
            - configMapRef:
                name: nexus-config
          volumeMounts:
            - name: private-media
              mountPath: /app/private_media
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
