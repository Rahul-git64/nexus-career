apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# CD can override the tags with: kustomize edit set image ...
images:
  - name: nexus-career-backend
    newTag: latest
  - name: nexus-career-frontend
    newTag: latest
