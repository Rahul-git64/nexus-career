# Needs an ingress controller (e.g. ingress-nginx). Without one, use `make k8s-forward`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
spec:
  ingressClassName: nginx
  rules:
    - host: nexus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
